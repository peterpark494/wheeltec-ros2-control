odom_curve_controller:
  ros__parameters:
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel

    # Reference in the captured start-pose frame: y = 0.05*x^2.
    x_length_m: 3.20
    curve_coefficient: 0.05
    waypoint_spacing_m: 0.10
    acceptance_radius_m: 0.16
    end_tolerance_m: 0.10

    max_linear_mps: 0.15
    max_angular_rps: 0.25
    linear_gain: 2.0
    angular_gain: 1.5

    max_cross_track_m: 0.80
    odom_timeout_s: 0.50
    max_run_time_s: 90.0
    control_rate_hz: 20.0

    # Enabling captures the current odom pose as local (0, 0, 0).
    enabled: false
