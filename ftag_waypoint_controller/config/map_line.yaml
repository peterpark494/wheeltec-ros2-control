map_line_controller:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    cmd_vel_topic: /cmd_vel

    # Fixed line selected in RViz2, expressed in the map frame (metres).
    start_x: -0.05283617973327637
    start_y: 0.005418464541143524
    end_x: 1.9724102020263672
    end_y: -0.0378357470035553

    control_rate_hz: 20.0
    max_linear_mps: 0.08
    max_angular_rps: 0.35
    linear_gain: 2.0
    angular_gain: 1.5

    # The paper is waypoint guidance. References are generated on the fixed
    # straight line, so no RViz point list is required.
    waypoint_spacing_m: 0.40
    acceptance_radius_m: 0.20

    start_tolerance_m: 0.10
    start_yaw_tolerance_rad: 0.20
    end_tolerance_m: 0.10
    max_cross_track_m: 0.40
    tf_timeout_s: 1.0
    max_run_time_s: 90.0

    # Starting the launch file never moves the robot.
    enabled: false
